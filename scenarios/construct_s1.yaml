# 紧凑 4 节点环的底稿。只留 C1/C2 用得到的量。
# 热容、食季、逐 token 循环不在这里。
nodes: 4
topology: ring
arrival_window_s: 900.0
drain_s: 1200
control_period_s: 1.0
model:
  layers: 32
  kv_heads: 8
  head_dim: 128
  bytes_per_elem: 2
gpu:
  kv_gib: 24.0
  t_fixed_s: 0.003
  t_weights_s: 0.01
  t_kv_tok_s: 1.0e-7
  t_seq_s: 5.0e-5
  mem_freq_exp: 0.6
thermal:
  P_idle: 60
  P_max: 300
  gamma: 2.4
  f_min: 0.35
net:
  link_gbps: 10.0
  hop_latency_s: 0.005
background:
  gbps_per_node: 2.375
  strict_priority: true
  pairs:
    - [0, 2]
    - [1, 2]
cost:
  mode: free
  timeout_s: 120.0
  switch_s: 0.02
workload:
  p_long: 0.2
