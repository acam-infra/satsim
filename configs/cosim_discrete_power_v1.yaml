name: cosim_discrete_power_v1
title: "Discrete power tiers (0W idle + low/high) on heterogeneous SSO2 hotspot"
description: >-
  Calibrated multi-plane heterogeneous SSO (4x4 compute + 3 RS) regional hotspot
  benchmark under discrete power tiers (0W idle, 150W low, 300W high) and linear
  RC thermal cap (T_max_C=80C, P_dark=160W). Exposes local thermal downgrade and
  eclipse power capping for static place_once vs least_loaded and cool_aware.
trace: ../input/traces/coop-sso2.trace.json
scenario: ../input/traces/coop-sso2.scenario.json
delivery: final
control_period_s: 2.0
frame_s: 10.0
model: {layers: 32, kv_heads: 8, head_dim: 128, bytes_per_elem: 2}
gpu:
  kv_gib: 40.0
  t_fixed_s: 0.003
  t_weights_s: 0.01
  t_kv_tok_s: 1.0e-7
  t_seq_s: 5.0e-5
  mem_freq_exp: 0.6
power:
  mode: discrete_tiers
  P_dark: 160.0
  prefer_high_clock: true
  tiers:
    - {name: idle_0w, power_w: 0.0, max_batch: 0, clock_f: 0.0}
    - {name: low, power_w: 150.0, max_batch: 4, clock_f: 0.65, prefill_clock_f: 0.35}
    - {name: high, power_w: 300.0, max_batch: 12, clock_f: 1.0, prefill_clock_f: 1.0}
thermal:
  tau_s: 120.0
  R_th: 0.25
  T_amb_C: 20.0
  T0_C: 42.0
  T_max_C: 80.0
  thermal_horizon_s: 30.0
net:
  link_gbps: {intra: 10.0, inter: 10.0, rs: 10.0}
  hop_latency_s: 0.005
migration:
  timeout_s: 120.0
  switch_s: 0.02
workload:
  arrival_window_s: 3600
  source_rates_per_min: [10.0, 1.5, 1.5]
  rate_per_rs_per_min: 4.33
  p_long: 0.35
  long_out: [6000, 18000]
  short_out: [200, 1200]
  long_pin: 2000
  short_pin: 500
  long_upload_MB: 500
  short_upload_MB: 50
  reserve_output_budget: true
  release_burst: {period_s: 900, duration_s: 150, source_phase_s: 90}
slo:
  deadline_factor_long: 1.6
  deadline_factor_short: 4.0
  min_deadline_s: 120
  max_stall_frac: 0.1
policy:
  stall_weight: 1.0
rebalance_invariants:
  interval_s: 5.0
  max_inflight: 24
  max_mig_per_req: 4
policies:
  place_once: {place: orbit_thermal, migrate: none}
  least_loaded: {policy: least_loaded}
  cool_aware: {place: orbit_thermal, migrate: cool_aware}
  deadline_rc:
    policy: thermal_rebalance
    placement: {policy: orbit_load}
    thermal_aware: rc
  discrete_rh_greedy:
    policy: discrete_rh_greedy
    placement: {policy: orbit_load}
seeds: [11, 12, 13]
