# 跨轨 E★ 加严争用（入口：scripts/exp_orbit_estar_contention.py）
# 拓扑：orbit_planes 2×2 grid；E★=(0,2)
# 功率：换位后暗 0+1、亮 2+3（place_once 仍有亮星可活）；有代价臂目标收束到 2
# 突发：控制拍内尽量填满 inflight（sync_burst）
# 主轴 link_gbps；辅 timeout / control / caps；bg=0
name: orbit_planes_estar_contention_v1
base: construct_orbit_planes_s1.yaml
trace:
  kind: synthetic_pass
  compress_horizon_s: 60
  pack_window_s: 900
  target_n: 88
  jitter_s: 0.05
  token_pad:
    mode: floor
    long_out: 16000
    long_pin: 8000
    short_out: 200
    short_pin: 500
t_swap:
  anchor: max_cluster
  offset_s: 40
  P_cap: 80
contention:
  background_gbps_per_node: 0.0
  link_gbps: 0.5
  timeout_s: 30.0
  control_period_s: 0.25
  max_inflight: 32
  max_out: 8
  corridor_bright_node: 2
  # 换位后额外压暗的节点（默认已压 node0；此处再压 1，逼 0/1→2 共享 E★）
  extra_dark_after_swap: [1]
  sync_burst: true
arms:
  - place_once
  - rebalance_free
  - rebalance_random
seeds: [1, 2, 3, 4, 5]
slo:
  tpot_slo: 0.032
