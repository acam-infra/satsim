[project]
name = "satsim"
version = "0.1.0"
description = "Minimal orbit-pod migration mechanism: declarative YAML, closed knobs."
authors = [
    { name = "coco", email = "chocolatedesue@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0.3",
    "scipy>=1.14",
    "simpy>=4.1.2",
]

[project.scripts]
satsim = "satsim.__main__:main"
satsim-cosim = "satsim.cosim.run:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
