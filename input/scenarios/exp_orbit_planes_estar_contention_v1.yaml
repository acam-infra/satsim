# 跨轨瓶颈链路 E★ 拥塞实验（运行入口：scripts/exp_orbit_estar_contention.py）
# 场景背景说明：../scenes/scene_orbit_planes_estar_contention_v1.yaml（本文件不走常规 resolve_spec）
# 拓扑：orbit_planes 2×2 网格；瓶颈边 E★=(0,2)
# 供电限制：限功切换后卫星 0 和 1 变暗降频、卫星 2 和 3 保持满血；占带宽迁移策略将目标集中到卫星 2
# 突发设置：每个控制周期尽量填满并发迁移流（sync_burst）
# 核心变量：link_gbps；辅助参数：timeout / control / 并发上限；背景流 bg=0
name: exp_orbit_planes_estar_contention_v1
base: base_orbit_planes_s1.yaml
trace:
  kind: synthetic_pass
  compress_horizon_s: 60
  pack_window_s: 900
  target_n: 88
  jitter_s: 0.05
  token_pad:
    mode: floor
    long_out: 16000
    long_pin: 8000
    short_out: 200
    short_pin: 500
t_swap:
  anchor: max_cluster
  offset_s: 40
  P_cap: 80
contention:
  background_gbps_per_node: 0.0
  link_gbps: 0.5
  timeout_s: 30.0
  control_period_s: 0.25
  max_inflight: 32
  max_out: 8
  corridor_bright_node: 2
  # 限功切换后额外限制功耗的节点（默认已限制 node0；此处再限制 node1，迫使 0/1→2 共享瓶颈边 E★）
  extra_dark_after_swap: [1]
  sync_burst: true
arms:
  - place_once
  - rebalance_free
  - rebalance_random
seeds: [1, 2, 3, 4, 5]
slo:
  tpot_slo: 0.032
