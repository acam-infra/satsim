# C1: place_once vs rebalance_local
# C2: rebalance_local vs rebalance_over_link；*_nobg / net 为对照
# 全局调度器：scheduler + link_cost（+ hysteresis / knobs）。off/full/net 请加引号。
name: stac_s1_cost_claims_v3
base: construct_s1.yaml
trace:
  kind: synthetic_pass
  compress_horizon_s: 60
  pack_window_s: 900
  target_n: 88
  jitter_s: 0.05
  token_pad:
    mode: floor
    long_out: 16000
    long_pin: 8000
    short_out: 200
    short_pin: 500
t_swap:
  anchor: max_cluster
  offset_s: 40
  P_cap: 80
overrides:
  arrival_window_s: 900.0
  background.gbps_per_node: 2.75
  background.strict_priority: true
  net.link_gbps: 10.0
  gpu.kv_gib: 24.0
policies:
  place_once:
    scheduler: place_once
    link_cost: "off"
  rebalance_local:
    scheduler: rebalance_local
    link_cost: "off"
    hysteresis: 0.15
  rebalance_over_link:
    scheduler: rebalance_over_link
    link_cost: "full"
    hysteresis: 0.15
  rebalance_over_link_net:
    scheduler: rebalance_over_link
    link_cost: "net"
    hysteresis: 0.15
  rebalance_local_nobg:
    scheduler: rebalance_local
    link_cost: "off"
    hysteresis: 0.15
    knobs:
      background.gbps_per_node: 0
  rebalance_over_link_nobg:
    scheduler: rebalance_over_link
    link_cost: "full"
    hysteresis: 0.15
    knobs:
      background.gbps_per_node: 0
seeds: [1, 2, 3, 4, 5]
slo:
  tpot_slo: 0.032
evidence: sim_synthetic_pass_power_ISL
metadata:
  scene: ../scenes/inferred_orbit_pod_v3.yaml
