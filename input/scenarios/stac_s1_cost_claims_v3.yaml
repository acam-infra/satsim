# 论文三档：
#   1) place_once — 初次分配 only
#   2) rebalance_free — 实时再分配 · 无消耗
#   3) rebalance_random / rebalance_ours — 有消耗再分配（random 基线；ours=TODO）
# C1: place_once vs rebalance_free
# C2: rebalance_free vs rebalance_random（*_nobg 对照）
name: stac_s1_cost_claims_v3
base: construct_s1.yaml
trace:
  kind: synthetic_pass
  compress_horizon_s: 60
  pack_window_s: 900
  target_n: 88
  jitter_s: 0.05
  token_pad:
    mode: floor
    long_out: 16000
    long_pin: 8000
    short_out: 200
    short_pin: 500
t_swap:
  anchor: max_cluster
  offset_s: 40
  P_cap: 80
overrides:
  arrival_window_s: 900.0
  background.gbps_per_node: 2.75
  background.strict_priority: true
  net.link_gbps: 10.0
  gpu.kv_gib: 24.0
policies:
  place_once:
    scheduler: place_once
    link_cost: "off"
  rebalance_free:
    scheduler: rebalance_free
    link_cost: "off"
    hysteresis: 0.15
  rebalance_random:
    scheduler: rebalance_random
    link_cost: "full"
  rebalance_ours:
    scheduler: rebalance_ours
    link_cost: "full"
  rebalance_free_nobg:
    scheduler: rebalance_free
    link_cost: "off"
    hysteresis: 0.15
    knobs:
      background.gbps_per_node: 0
  rebalance_random_nobg:
    scheduler: rebalance_random
    link_cost: "full"
    knobs:
      background.gbps_per_node: 0
seeds: [1, 2, 3, 4, 5]
slo:
  tpot_slo: 0.032
evidence: sim_synthetic_pass_power_ISL
metadata:
  scene: ../scenes/inferred_orbit_pod_v3.yaml
