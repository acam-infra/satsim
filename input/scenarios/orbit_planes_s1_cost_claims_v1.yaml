# orbit_planes 上的三档 e2e（与 stac_s1 同旋钮，拓扑换成轨道连边快照）
# C1: place_once vs rebalance_free
# C2: rebalance_free vs rebalance_random（*_nobg 对照）
name: orbit_planes_s1_cost_claims_v1
base: construct_orbit_planes_s1.yaml
trace:
  kind: synthetic_pass
  compress_horizon_s: 60
  pack_window_s: 900
  target_n: 88
  jitter_s: 0.05
  token_pad:
    mode: floor
    long_out: 16000
    long_pin: 8000
    short_out: 200
    short_pin: 500
t_swap:
  anchor: max_cluster
  offset_s: 40
  P_cap: 80
overrides:
  arrival_window_s: 900.0
  background.gbps_per_node: 2.75
  background.strict_priority: true
  net.link_gbps: 10.0
  gpu.kv_gib: 24.0
policies:
  place_once:
    scheduler: place_once
    link_cost: "off"
  rebalance_free:
    scheduler: rebalance_free
    link_cost: "off"
    hysteresis: 0.15
  rebalance_random:
    scheduler: rebalance_random
    link_cost: "full"
  rebalance_free_nobg:
    scheduler: rebalance_free
    link_cost: "off"
    hysteresis: 0.15
    knobs:
      background.gbps_per_node: 0
  rebalance_random_nobg:
    scheduler: rebalance_random
    link_cost: "full"
    knobs:
      background.gbps_per_node: 0
seeds: [1, 2, 3, 4, 5]
slo:
  tpot_slo: 0.032
evidence: sim_orbit_planes_s1_cost_claims
metadata:
  scene: ../scenes/orbit_planes_s1_cost_claims_v1.yaml
