# 动态温控模式（thermal.mode=dynamic）下的三档调度对比：检验能否复现 C1/C2 趋势。
# 请求负载与 exp_ring_s1_cost_claims_v3 一致；定时限功时间表仍由 t_swap 生成但 dynamic 模式会忽略。
# t_swap 仅作为统计达标有效吞吐（goodput）的起始时间锚点（与定时限功基线保持同口径）。
name: exp_ring_s1_dynamic_thermal_v1
base: base_ring_s1_dynamic.yaml
trace:
  kind: synthetic_pass
  compress_horizon_s: 60
  pack_window_s: 900
  target_n: 88
  jitter_s: 0.05
  token_pad:
    mode: floor
    long_out: 16000
    long_pin: 8000
    short_out: 200
    short_pin: 500
t_swap:
  anchor: max_cluster
  offset_s: 40
  P_cap: 80
overrides:
  arrival_window_s: 900.0
  background.gbps_per_node: 2.75
  background.strict_priority: true
  net.link_gbps: 10.0
  gpu.kv_gib: 24.0
policies:
  place_once:
    scheduler: place_once
    link_cost: "off"
  rebalance_free:
    scheduler: rebalance_free
    link_cost: "off"
    hysteresis: 0.15
  rebalance_random:
    scheduler: rebalance_random
    link_cost: "full"
  rebalance_ours:
    scheduler: rebalance_ours
    link_cost: "full"
  rebalance_free_nobg:
    scheduler: rebalance_free
    link_cost: "off"
    hysteresis: 0.15
    knobs:
      background.gbps_per_node: 0
  rebalance_random_nobg:
    scheduler: rebalance_random
    link_cost: "full"
    knobs:
      background.gbps_per_node: 0
seeds: [1, 2, 3]
slo:
  tpot_slo: 0.032
evidence: sim_synthetic_pass_dynamic_thermal
metadata:
  scene: ../scenes/scene_ring_s1_dynamic_thermal_v1.yaml
