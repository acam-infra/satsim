schema: satsim.scene/v1
name: scene_ring_s1_dynamic_thermal_v1
story: |
  与主实验相同的四星环拓扑和模拟过境请求流；温控模式改为动态温控（thermal.mode=dynamic）：
  有负载的节点按一阶 RC 模型升温，超过温度阈值后自动降频（而非按预设时间表定时限功）。
  t_swap 仍作为统计达标有效吞吐（goodput）的起始时间锚点；explicit_events 虽写入配置但 dynamic 模式不会读取。
  用于检验：单靠负载发热降频能否拉开首次分配与无消耗迁移的差距（结论 C1），以及随机迁移是否因抢带宽而回落（结论 C2）。
not_modeled:
  - 真实星历和轨道六根数
  - 随时间变化的动态星间链路
  - 全星座规模
  - 完整轨道热平衡/食季（本场景为一阶 RC 温控模型）
  - 定时限功切换（本场景改由负载发热触发降频）
  - STAC L1 的真实到达时间戳
mirrors:
  cfg:
    nodes: 4
    topology: ring
    arrival_window_s: 900.0
    net.link_gbps: 10.0
    background.gbps_per_node: 2.75
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
    thermal.mode: dynamic
  spec:
    t_swap.anchor: max_cluster
    t_swap.offset_s: 40
    t_swap.P_cap: 80
    trace.kind: synthetic_pass
    trace.compress_horizon_s: 60
    trace.pack_window_s: 900
    trace.target_n: 88
