schema: satsim.scene/v1
name: scene_orbit_planes_estar_contention_v1
story: |
  双轨静态拓扑（orbit_planes）上的跨轨瓶颈边 E★ 拥塞实验说明。
  限功切换后卫星 0 和 1 变暗降频、卫星 2 和 3 保持满血；占带宽迁移策略将请求集中迁往卫星 2，迁移路径全部挤在瓶颈链路 E★=(0,2) 上。
  本文件仅作场景背景说明；运行入口是 scripts/exp_orbit_estar_contention.py
  （读取 configs/exp_orbit_planes_estar_contention_v1.yaml），不走常规 satsim 命令行入口。
not_modeled:
  - 常规 policies/metadata 驱动的 resolve_spec 入口
  - 连续星历 / 动态断链重连
  - 主论文 C1/C2 汇总表（本文件对应独立的瓶颈拥塞实验脚本）
mirrors:
  cfg:
    nodes: 4
    topology: orbit_planes
    arrival_window_s: 900.0
    net.link_gbps: 0.5
    background.gbps_per_node: 0.0
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 30.0
  spec:
    t_swap.anchor: max_cluster
    t_swap.offset_s: 40
    t_swap.P_cap: 80
    trace.kind: synthetic_pass
    trace.compress_horizon_s: 60
    trace.pack_window_s: 900
    trace.target_n: 88
