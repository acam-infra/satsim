schema: satsim.scene/v1
name: scene_sharegpt_s1_smoke_v1
story: |
  四星环拓扑；使用 ShareGPT 真实对话长度 CSV + 固定间隔到达（EcoServe 风格，无原始时间戳）。
  CSV 默认按字符数除以 4 估算 token 数；冒烟测试使用 len_scale=10 放大长度以增加负载压力。缩放后输入+输出 >= 1500 视为长请求。
  本文件仅作冒烟测试，不产出论文主表数据。
not_modeled:
  - 真实 HuggingFace 分词器 / EcoServe 客户端 TTFT-TPOT 延迟约束
  - EcoServe 跨实例编排 / 不迁移 KV 模式
mirrors:
  cfg:
    nodes: 4
    topology: ring
    arrival_window_s: 90.0
    net.link_gbps: 10.0
    background.gbps_per_node: 2.0
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
  spec:
    t_swap.anchor: absolute
    t_swap.t_s: 30
    t_swap.P_cap: 80
    trace.kind: sharegpt
    trace.window_s: 40
    trace.rate_per_s: 3.0
    trace.num_prompts: 120
