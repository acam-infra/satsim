schema: satsim.scene/v1
name: scene_inferred_orbit_pod_v3
story: |
  四颗卫星组成同一轨道面上的同轨星组，不是全星座。
  一次对地过境的请求被压缩进 compress_horizon_s 时长内集中到达；
  最密到达簇之后再过 offset_s 触发限功切换（切换前卫星 2 被限制功耗降频，切换后改为卫星 0 被限制功耗）。
  环上 10 Gbps 的星间链路同时承载两对高优先级背景流量，汇合在 1→2 链路上。
  首次分配把请求放到到达时刻算力更快的节点。限功切换之后该节点变慢，首次分配无法应对。
  运行中途迁移将请求挪到算力充足的节点。KV 状态迁移流与背景流走同一条最短路，共同受每条链路的带宽上限约束。
not_modeled:
  - 真实星历和轨道六根数
  - 随时间变化的动态星间链路
  - 全星座规模
  - 完整轨道热平衡/食季（本场景使用定时限功模式；可选 dynamic 仅为一阶 RC 温控模型）
  - STAC L1 的真实到达时间戳（这里是压缩进固定窗口的模拟过境请求流）
  - 上游全星座引擎跑出的吞吐数字（本文件不引用、不复写那些数字）
mirrors:
  cfg:
    nodes: 4
    topology: ring
    arrival_window_s: 900.0
    net.link_gbps: 10.0
    background.gbps_per_node: 2.75
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
  spec:
    t_swap.anchor: max_cluster
    t_swap.offset_s: 40
    t_swap.P_cap: 80
    trace.kind: synthetic_pass
    trace.compress_horizon_s: 60
    trace.pack_window_s: 900
    trace.target_n: 88
