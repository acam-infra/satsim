schema: satsim.scene/v1
name: scene_inferred_orbit_pod_v3
story: |
  四颗星组成同一轨道面上的紧凑计算舱段，不是全星座。
  一次对地过境被压进 compress_horizon_s，请求在这段里到达；
  最密时隙之后 offset_s 触发功率帽换位（换位前 node 2 被压住，换位后 node 0 被压住）。
  环上 10 Gbps 的抽象 ISL 同时扛着两对优先背景流，汇合在 1→2， offered 超过链路口径。
  首次分配把请求放到当时更快的节点。换位之后这台变慢，首次分配解决不了。
  运行时重分配再放一次。KV 和背景流走同一条最短路，一起受每条链路的带宽上限约束。
not_modeled:
  - 真实星历和六根数
  - 时变 ISL
  - 全星座规模
  - 完整轨道热平衡/食季（本 claim 场景仍用显式功率帽；可选 dynamic 仅为一阶 RC 示意）
  - STAC L1 的真实到达时刻（这里是均匀压进 horizon 的合成簇）
  - 上游全引擎跑出的 goodput 数字（本文件不引用、不复写那些数）
mirrors:
  cfg:
    nodes: 4
    topology: ring
    arrival_window_s: 900.0
    net.link_gbps: 10.0
    background.gbps_per_node: 2.75
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
  spec:
    t_swap.anchor: max_cluster
    t_swap.offset_s: 40
    t_swap.P_cap: 80
    trace.kind: synthetic_pass
    trace.compress_horizon_s: 60
    trace.pack_window_s: 900
    trace.target_n: 88
