schema: satsim.scene/v1
name: scene_orbit_planes_smoke_v1
story: |
  双轨道面声明式圆轨拓扑：2 颗遥感星（sensing）+ 2 颗算力星（compute）。
  启动时按最大通信距离生成一次星间链路邻接图（同轨相邻 + 跨轨近距连线，呈 2×2 网格），
  寻路仍使用图上 BFS；流体网络与请求迁移逻辑与环拓扑一致。
  本文件仅作拓扑冒烟测试，不产出论文主表数据。
not_modeled:
  - 连续星历运动
  - 逐时刻可见性重连
  - Walker / 全星座规模
  - 遥感任务链与仅算力星运行约束（节点角色仅为元数据）
  - 主实验结论表数据
mirrors:
  cfg:
    nodes: 4
    topology: orbit_planes
    arrival_window_s: 120.0
    net.link_gbps: 10.0
    background.gbps_per_node: 0
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
  spec:
    t_swap.anchor: absolute
    t_swap.t_s: 40
    t_swap.P_cap: 80
    trace.kind: poisson
    trace.window_s: 60
    trace.rate_per_s: 0.5
