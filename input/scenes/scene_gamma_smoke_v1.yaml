schema: satsim.scene/v1
name: scene_gamma_smoke_v1
story: |
  Gamma 分布间隔到达冒烟测试（用变异系数 CV 控制突发程度，cv=1 时退化为普通泊松到达）。
  限功切换时刻使用固定绝对时间（absolute）。
not_modeled:
  - 真实星历
  - 主实验结论表数据
mirrors:
  cfg:
    nodes: 4
    topology: ring
    arrival_window_s: 180.0
    net.link_gbps: 10.0
    background.gbps_per_node: 0
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
  spec:
    t_swap.anchor: absolute
    t_swap.t_s: 60
    t_swap.P_cap: 80
    trace.kind: gamma
    trace.window_s: 120
    trace.rate_per_s: 0.4
    trace.cv: 1.0
