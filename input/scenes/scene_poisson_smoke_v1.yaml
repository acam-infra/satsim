schema: satsim.scene/v1
name: scene_poisson_smoke_v1
story: |
  与主实验相同的四星环拓扑，请求到达改为齐次泊松过程（离线生成）。
  限功切换时刻使用固定绝对时间（absolute），避免不同随机种子下切换时刻漂移。
  本文件仅用于冒烟测试，不产出论文主表数据。
not_modeled:
  - 真实星历
  - 主实验结论表数据
mirrors:
  cfg:
    nodes: 4
    topology: ring
    arrival_window_s: 120.0
    net.link_gbps: 10.0
    background.gbps_per_node: 0
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
  spec:
    t_swap.anchor: absolute
    t_swap.t_s: 40
    t_swap.P_cap: 80
    trace.kind: poisson
    trace.window_s: 60
    trace.rate_per_s: 0.5
