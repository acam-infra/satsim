schema: satsim.scene/v1
name: scene_orbit_planes_s1_cost_claims_v1
story: |
  双轨道面静态轨道拓扑（2 颗遥感星 sensing + 2 颗算力星 compute）上的三档调度策略对比。
  启动时按最大通信距离生成一次固定星间链路（连边为 (0,1)(0,2)(1,3)(2,3)，呈 2×2 网格）；
  模拟过境请求流、限功切换、背景流量以及 C1/C2 评估口径均与四星环主实验 exp_ring_s1_cost_claims_v3 对齐，
  唯一区别是拓扑由 orbit_planes 轨道参数生成而非固定环。
not_modeled:
  - 连续星历运动
  - 逐时刻可见性重连
  - Walker / 全星座规模
  - 遥感任务链与仅算力星运行约束（节点角色仅为元数据）
  - 完整轨道热平衡/食季（本场景使用定时限功模式；可选 dynamic 仅为一阶 RC 温控模型）
mirrors:
  cfg:
    nodes: 4
    topology: orbit_planes
    arrival_window_s: 900.0
    net.link_gbps: 10.0
    background.gbps_per_node: 2.75
    background.strict_priority: true
    gpu.kv_gib: 24.0
    workload.p_long: 0.2
    cost.timeout_s: 120.0
  spec:
    t_swap.anchor: max_cluster
    t_swap.offset_s: 40
    t_swap.P_cap: 80
    trace.kind: synthetic_pass
    trace.compress_horizon_s: 60
    trace.pack_window_s: 900
    trace.target_n: 88
